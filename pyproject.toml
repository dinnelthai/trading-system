[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-lifecycle-simulator"
version = "0.1.0"
description = "Stochastic agent-based simulator for token launch market lifecycle research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pump-sim = "pump_sim.cli:main"
pump-calibrate = "pump_sim.calibrate:main"
pump-replay = "pump_sim.replay_cli:main"
solana-block-export = "pump_sim.block_export_cli:main"
solana-token-probe = "pump_sim.token_probe_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
